    <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",Arial,sans-serif;background:#1a2a4a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

    .hdr h1{font-size:1.2rem;color:#c9a84c;margin-top:8px}
    .hdr p{font-size:0.78rem;color:#aaa;margin-top:4px}
    .body{padding:24px}
    label{display:block;font-size:0.8rem;color:#555;margin-bottom:5px;font-weight:600}
    input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:0.95rem;margin-bottom:14px}
    button{width:100%;padding:12px;background:linear-gradient(135deg,#c9a84c,#e8c96a);color:#1a2a4a;border:none;border-radius:8px;font-weight:700;font-size:0.95rem;cursor:pointer}
    .err{color:#c0392b;font-size:0.82rem;margin-top:10px;display:none;text-align:center}
    .result-card{display:none;padding:0}
    .r-hdr{background:#c9a84c;padding:14px 20px;text-align:center}
    .r-hdr h2{font-size:1rem;color:#1a2a4a}
    .r-info{padding:16px 20px;font-size:0.85rem;border-bottom:1px solid #eee}
    .r-info div{margin-bottom:4px}
    .fee-box{display:flex;justify-content:space-around;padding:14px 20px;background:#f4f6fb;text-align:center}
    .fee-box div{font-size:0.7rem;color:#888}
    .fee-box strong{display:block;font-size:1rem;margin-top:2px}
    table{width:100%;border-collapse:collapse;font-size:0.82rem;margin:12px 0}
    th{background:#1a2a4a;color:#c9a84c;padding:7px 10px;text-align:left;font-size:0.7rem}
    td{padding:6px 10px;border-bottom:1px solid #eee}
    .term-block{padding:0 20px 16px}
    .avg{text-align:center;padding:12px;background:#e8f5e9;border-radius:8px;margin:10px 20px;font-weight:700;color:#16a34a}
    .back-btn{margin:16px 20px;background:transparent;border:1.5px solid #1a2a4a;color:#1a2a4a}
    .footer{text-align:center;padding:14px;font-size:0.7rem;color:#999;border-top:1px solid #eee}

    function lookupResult(){
    var adm=document.getElementById("pf-adm").value.trim();
    var pin=document.getElementById("pf-pin").value.trim();
    var rec=DATA[adm];
    var err=document.getElementById("pf-err");
    if(!rec||rec.pin!==pin){ err.style.display="block"; return; }
    err.style.display="none";
    document.getElementById("login-view").style.display="none";
    var rv=document.getElementById("result-view"); rv.style.display="block";
    var html="";
    html+="<div class=\"r-hdr\"><h2>"+rec.name+"</h2></div>";
    html+="<div class=\"r-info\"><div><strong>Class:</strong> "+rec.className+"</div><div><strong>Level:</strong> "+rec.level+"</div></div>";
    html+="<div class=\"fee-box\"><div>Expected<br><strong>₦"+Number(rec.feeExpected).toLocaleString()+"</strong></div><div>Paid<br><strong style=\"color:#16a34a\">₦"+Number(rec.feePaid).toLocaleString()+"</strong></div><div>Balance<br><strong style=\"color:"+(rec.feeBalance>0?"#c0392b":"#16a34a")+"\">₦"+Number(rec.feeBalance).toLocaleString()+"</strong></div></div>";
    if(!rec.results.length){ html+="<div class=\"term-block\"><p style=\"color:#888;text-align:center;padding:20px 0\">No results published yet.</p></div>"; }
    rec.results.forEach(function(r){
    html+="<div class=\"term-block\"><div style=\"font-weight:700;color:#1a2a4a;margin:10px 0 4px\">"+r.term+"</div>";
    html+="<table><thead><tr><th>Subject</th><th>Total</th><th>Grade</th><th>Remark</th></tr></thead><tbody>";
    r.subjects.forEach(function(sub){ html+="<tr><td>"+sub.name+"</td><td>"+sub.total+"</td><td>"+sub.grade+"</td><td>"+sub.remark+"</td></tr>"; });
    html+="</tbody></table></div>";
    html+="<div class=\"avg\">Average: "+r.average+"%</div>";
    });
    html+="<button class=\"back-btn\" onclick=\"location.reload()\">← Look Up Another Student</button>";
    rv.innerHTML=html;
    }
