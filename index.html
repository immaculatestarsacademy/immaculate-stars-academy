<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immaculate Stars Academy | Laying a Solid Foundation</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A1F44;
  --navy-dark: #060F22;
  --navy-light: #1a3668;
  --crimson: #C41E3A;
  --crimson-dark: #9b1530;
  --gold: #F0A500;
  --gold-light: #ffc93c;
  --white: #ffffff;
  --off-white: #F8F9FB;
  --grey-light: #EEF1F6;
  --grey-mid: #8896A8;
  --grey-dark: #3D4F66;
  --text-dark: #0A1F44;
  --text-body: #3D4F66;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; color: var(--text-body); background: var(--white); overflow-x: hidden; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(10,31,68,0.97); backdrop-filter: blur(12px);
  padding: 0 5%; height: 72px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid var(--gold);
}
.nav-brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
.nav-logo {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--gold); display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 900; color: var(--navy);
}
.nav-name { color: white; }
.nav-name span:first-child { display: block; font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
.nav-name span:last-child { display: block; font-size: 10px; font-weight: 400; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13.5px; font-weight: 500; letter-spacing: 0.3px; transition: color 0.2s; }
.nav-links a:hover { color: var(--gold); }
.nav-portal-btn {
  background: var(--crimson); color: white; padding: 9px 20px;
  border-radius: 6px; font-size: 13px; font-weight: 600;
  text-decoration: none; transition: background 0.2s; letter-spacing: 0.3px;
}
.nav-portal-btn:hover { background: var(--crimson-dark); color: white !important; }
.nav-toggle { display: none; cursor: pointer; flex-direction: column; gap: 5px; }
.nav-toggle span { width: 25px; height: 2px; background: white; display: block; transition: 0.3s; }

/* HERO */
#hero {
  min-height: 100vh; background: var(--navy-dark);
  display: flex; align-items: center; position: relative; overflow: hidden;
  padding-top: 72px;
}
.hero-bg-pattern {
  position: absolute; inset: 0; opacity: 0.04;
  background-image: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 1px, transparent 0, transparent 50%);
  background-size: 30px 30px;
}
.hero-accent-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--gold), var(--crimson), var(--gold));
}
.stars-container { position: absolute; inset: 0; pointer-events: none; }
.star {
  position: absolute; border-radius: 50%; background: white;
  animation: twinkle 3s infinite alternate;
}
.hero-content {
  position: relative; z-index: 2; padding: 80px 5%;
  max-width: 1200px; margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
}
.hero-left {}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(240,165,0,0.15); border: 1px solid rgba(240,165,0,0.3);
  padding: 6px 16px; border-radius: 20px; margin-bottom: 28px;
  font-size: 12px; font-weight: 600; color: var(--gold); letter-spacing: 2px; text-transform: uppercase;
}
.hero-eyebrow::before { content: '★'; font-size: 10px; }
h1.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 5vw, 62px); font-weight: 900;
  color: white; line-height: 1.12; margin-bottom: 24px;
}
h1.hero-title em { color: var(--gold); font-style: normal; }
.hero-motto {
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5);
  letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px;
}
.hero-desc {
  font-size: 16px; line-height: 1.75; color: rgba(255,255,255,0.72); margin-bottom: 40px; max-width: 480px;
}
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.btn-primary {
  display: inline-block; background: var(--gold); color: var(--navy-dark);
  padding: 14px 32px; border-radius: 6px; font-size: 14px; font-weight: 700;
  text-decoration: none; letter-spacing: 0.3px; transition: transform 0.2s, background 0.2s;
}
.btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); }
.btn-secondary {
  display: inline-block; background: transparent; color: white;
  padding: 14px 32px; border-radius: 6px; font-size: 14px; font-weight: 600;
  text-decoration: none; border: 1.5px solid rgba(255,255,255,0.3); letter-spacing: 0.3px;
  transition: border-color 0.2s, background 0.2s;
}
.btn-secondary:hover { border-color: white; background: rgba(255,255,255,0.08); }
.hero-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 1px;
  background: rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; margin-top: 48px;
}
.hero-stat {
  background: rgba(255,255,255,0.05); padding: 20px 16px; text-align: center;
}
.hero-stat strong { display: block; font-size: 30px; font-weight: 700; color: var(--gold); font-family: 'Playfair Display',serif; }
.hero-stat span { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 500; }
.hero-right { position: relative; }
.hero-card-stack { position: relative; }
.hero-main-card {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px; padding: 32px; color: white;
}
.hero-card-icon { font-size: 40px; margin-bottom: 16px; }
.hero-main-card h3 { font-family: 'Playfair Display',serif; font-size: 22px; margin-bottom: 10px; color: white; }
.hero-main-card p { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.7; }
.hero-pill-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.hero-pill {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 16px; display: flex; align-items: center; gap: 12px;
}
.hero-pill-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--crimson); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.hero-pill span { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 500; }
@keyframes twinkle { 0%{opacity:0.2} 100%{opacity:0.8} }

/* SECTIONS */
.section { padding: 100px 5%; }
.section-inner { max-width: 1200px; margin: 0 auto; }
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  color: var(--crimson); margin-bottom: 10px;
}
.section-title {
  font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 42px);
  font-weight: 800; color: var(--navy); line-height: 1.2; margin-bottom: 16px;
}
.section-sub { font-size: 16px; line-height: 1.75; color: var(--text-body); max-width: 580px; }
.section-divider { width: 56px; height: 4px; background: var(--gold); border-radius: 2px; margin: 20px 0; }

/* ABOUT */
#about { background: var(--off-white); }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; margin-top: 60px; }
.about-image-block {
  position: relative; border-radius: 16px; overflow: hidden;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  min-height: 420px; display: flex; align-items: center; justify-content: center;
}
.about-shield {
  width: 100px;
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">
    <div class="nav-logo">ISA</div>
    <div class="nav-name">
      <span>Immaculate Stars</span>
      <span>Academy</span>
    </div>
  </a>
  <div class="nav-links">
    <a href="#hero">Home</a>
    <a href="#about">About</a>
    <a href="/portal" class="nav-portal-btn">Parent Portal</a>
  </div>
</nav>

<main>
  <section id="hero">
    <div class="hero-bg-pattern"></div>
    <div class="hero-accent-bar"></div>
    <div class="hero-content">
      <div class="hero-left">
        <div class="hero-eyebrow">Welcome to ISA</div>
        <h1 class="hero-title">Laying a <em>Solid Foundation</em> for the Future</h1>
        <div class="hero-motto">Knowledge • Discipline • Excellence</div>
        <p class="hero-desc">Empowering students with holistic education, moral structure, and an innovative platform built for early development.</p>
        <div class="hero-actions">
          <a href="/portal" class="btn-primary">Access Parent Portal</a>
          <a href="#about" class="btn-secondary">Learn More</a>
        </div>
      </div>
    </div>
  </section>
</main>

</body>
</html>
